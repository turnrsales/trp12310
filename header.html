<script>
	$(document).ready(function () {

		function updateHeader45() {
			if ($(window).scrollTop() > 30) {
				$('header.header-45').addClass('sticky-active');
			} else {
				$('header.header-45').removeClass('sticky-active');
			}
		}

		function setActiveMenu45() {

			var currentPage = window.location.pathname.split('/').pop().toLowerCase();

			if (!currentPage) {
				currentPage = 'index.html';
			}

			$('.header-45 .main-navigation li').removeClass('active');

			$('.header-45 .main-navigation li a').each(function () {

				var href = $(this).attr('href');

				if (!href) {
					return;
				}

				var linkPage = href.split('/').pop().toLowerCase();

				if (linkPage === currentPage) {
					$(this).parent('li').addClass('active');
				}

			});
		}

		$(window).on('scroll', updateHeader45);

		updateHeader45();
		setActiveMenu45();

	});
</script>

<script>
	(function () {

		function initHeader45Slider() {

			var carousel45 = document.querySelector('.carousel-45');

			if (!carousel45) {
				return;
			}

			var carouselInner45 = carousel45.querySelector('.carousel-inner');
			var items45 = carousel45.querySelectorAll('.carousel-item');
			var indicators45 = carousel45.querySelectorAll('.carousel-indicators li');
			var prevButton45 = carousel45.querySelector('.prev');
			var nextButton45 = carousel45.querySelector('.next');

			if (
				!carouselInner45 ||
				!items45.length ||
				!prevButton45 ||
				!nextButton45
			) {
				return;
			}

			var currentIndex45 = 0;
			var autoSlide45;

			function showItem45(index) {

				if (index >= items45.length) {
					index = 0;
				}

				if (index < 0) {
					index = items45.length - 1;
				}

				currentIndex45 = index;

				carouselInner45.style.transform =
					'translateX(-' + (currentIndex45 * 100) + '%)';

				for (var i = 0; i < items45.length; i++) {
					items45[i].classList.remove('active');
				}

				for (var j = 0; j < indicators45.length; j++) {
					indicators45[j].classList.remove('active');
				}

				items45[currentIndex45].classList.add('active');

				if (indicators45[currentIndex45]) {
					indicators45[currentIndex45].classList.add('active');
				}
			}

			function startAutoSlide45() {

				clearInterval(autoSlide45);

				autoSlide45 = setInterval(function () {
					showItem45(currentIndex45 + 1);
				}, 5000);
			}

			nextButton45.addEventListener('click', function () {
				showItem45(currentIndex45 + 1);
				startAutoSlide45();
			});

			prevButton45.addEventListener('click', function () {
				showItem45(currentIndex45 - 1);
				startAutoSlide45();
			});

			for (var i = 0; i < indicators45.length; i++) {

				(function (index) {

					indicators45[index].addEventListener(
						'click',
						function () {
							showItem45(index);
							startAutoSlide45();
						}
					);

				})(i);
			}

			showItem45(0);
			startAutoSlide45();
		}

		if (document.readyState === 'loading') {

			document.addEventListener(
				'DOMContentLoaded',
				initHeader45Slider
			);

		} else {

			initHeader45Slider();

		}

	})();
</script>
